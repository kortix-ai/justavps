[project]
name = "kortix-justavps"
version = "0.1.0"
description = "Official Python SDK for the JustAVPS API — machines, filesystem, process execution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kortix", email = "support@justavps.com"},
]
keywords = ["kortix", "justavps", "vps", "api", "sdk", "cloud", "sandbox", "machines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://justavps.com"
Documentation = "https://justavps.com/api/docs"
Repository = "https://github.com/kortix-ai/justavps.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["justavps.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
