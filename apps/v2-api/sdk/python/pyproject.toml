[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kortix-justavps-v2"
version = "0.0.0"
description = "OpenAPI-generated Python SDK for the JustAVPS V2 API"
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["justavps_v2*"]
