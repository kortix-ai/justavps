# Dev Worker — separate from prod, uses kortix-dev.cloud domain.
#
# Fully isolated: own KV namespace, own PROXY_AUTH_SECRET, own PLATFORM_URL.
# Deploy with: npx wrangler deploy -c wrangler.dev.toml
#
# After deploying, add Worker route in CF dashboard:
#   Zone: kortix-dev.cloud → Route: *.kortix-dev.cloud/* → Worker: kortix-cloud-proxy-dev

name = "kortix-cloud-proxy-dev"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[[kv_namespaces]]
binding = "KV"
id = "30b11d4b604e4128b11afabe1692676d"

[vars]
ENVIRONMENT = "development"
PLATFORM_URL = "https://dev.justavps.com"
BROKER_ORIGIN = "https://broker-origin.kortix-dev.cloud"

# Secrets (set via `wrangler secret put -c wrangler.dev.toml`):
#   PROXY_AUTH_SECRET — must match dev.justavps.com's PROXY_AUTH_SECRET.
#   BROKER_SHARED_SECRET — shared HMAC secret for Worker -> broker requests.
#   Separate from prod's secret for full auth isolation.

[placement]
mode = "smart"
