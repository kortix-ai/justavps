name: Release Daemon

# Builds and uploads the daemon binary to R2 whenever daemon/ code changes on master.
# Vercel auto-deploys the Next.js app on push — this handles the Go binary side.

on:
  push:
    branches: [production]
    paths:
      - 'daemon/**'

concurrency:
  group: release-daemon
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Upload to R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: daemon/go.sum

      - name: Test
        working-directory: daemon
        run: go test -v ./...

      - name: Build linux/amd64
        working-directory: daemon
        env:
          VERSION: ${{ github.sha }}
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=${VERSION::7} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/justavps-daemon-linux-amd64 .
          ls -lh bin/justavps-daemon-linux-amd64

      - name: Upload to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          # Upload as latest (what cloud-init downloads)
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/justavps-releases/objects/daemon/latest/justavps-daemon-linux-amd64" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_API_KEY}" \
            --data-binary @daemon/bin/justavps-daemon-linux-amd64

          # Also upload versioned copy for rollbacks
          SHA="${GITHUB_SHA::7}"
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/justavps-releases/objects/daemon/${SHA}/justavps-daemon-linux-amd64" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_API_KEY}" \
            --data-binary @daemon/bin/justavps-daemon-linux-amd64

          echo "✅ Uploaded daemon ${SHA} to R2 (latest + versioned)"

      - name: Verify download
        run: |
          curl -sf -o /tmp/verify -w "HTTP %{http_code} — %{size_download} bytes" \
            "https://pub-caf7762051b942d5a801397d750a0dc3.r2.dev/daemon/latest/justavps-daemon-linux-amd64"
          echo ""
          chmod +x /tmp/verify && /tmp/verify --version
