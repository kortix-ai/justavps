name: Release Daemon

# Builds and uploads the daemon binary to R2 whenever daemon/ code changes.
# - production branch → daemon/latest/ (production download path)
# - main branch       → daemon/dev/latest/ (dev download path)
#
# After upload, writes a version.txt so the platform knows the latest version
# and can trigger fleet-wide self-updates via heartbeat responses.

on:
  push:
    branches: [production, main]
    paths:
      - 'daemon/**'
      - '!daemon/cmd/broker/**'
      - '!daemon/internal/broker/**'
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

concurrency:
  group: release-daemon-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Upload to R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: daemon/go.sum

      - name: Test
        working-directory: daemon
        run: go test -v ./...

      - name: Build linux/amd64
        working-directory: daemon
        env:
          VERSION: ${{ github.sha }}
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=${VERSION::7} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/justavps-daemon-linux-amd64 .
          ls -lh bin/justavps-daemon-linux-amd64

      - name: Set R2 path prefix
        id: r2path
        run: |
          REF="${{ inputs.ref || github.ref_name }}"
          if [[ "$REF" == "production" || "$REF" == "refs/heads/production" ]]; then
            echo "prefix=daemon" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=daemon/dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          PREFIX: ${{ steps.r2path.outputs.prefix }}
        run: |
          SHA="${GITHUB_SHA::7}"

          # Upload binary as latest
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/justavps-releases/objects/${PREFIX}/latest/justavps-daemon-linux-amd64" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_API_KEY}" \
            --data-binary @daemon/bin/justavps-daemon-linux-amd64

          # Upload versioned copy for rollbacks
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/justavps-releases/objects/${PREFIX}/${SHA}/justavps-daemon-linux-amd64" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_API_KEY}" \
            --data-binary @daemon/bin/justavps-daemon-linux-amd64

          # Write version.txt — platform reads this to know the latest version
          echo -n "${SHA}" | curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/justavps-releases/objects/${PREFIX}/latest/version.txt" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_API_KEY}" \
            --data-binary @-

          echo "✅ Uploaded daemon ${SHA} to R2 at ${PREFIX}/ (latest + versioned + version.txt)"

      - name: Verify download
        env:
          PREFIX: ${{ steps.r2path.outputs.prefix }}
        run: |
          curl -sf -o /tmp/verify -w "HTTP %{http_code} — %{size_download} bytes" \
            "https://pub-caf7762051b942d5a801397d750a0dc3.r2.dev/${PREFIX}/latest/justavps-daemon-linux-amd64"
          echo ""
          chmod +x /tmp/verify && /tmp/verify --version

          # Verify version.txt
          REMOTE_VERSION=$(curl -sf "https://pub-caf7762051b942d5a801397d750a0dc3.r2.dev/${PREFIX}/latest/version.txt")
          echo "version.txt = ${REMOTE_VERSION}"
          echo "### Daemon Released" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${REMOTE_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel:** ${PREFIX}" >> $GITHUB_STEP_SUMMARY
