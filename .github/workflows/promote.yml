name: Promote to Production

# Manually promote main → production via GitHub Actions UI.
# After fast-forward, triggers daemon release + worker deploy for the production branch
# (GITHUB_TOKEN pushes don't cascade-trigger workflows, so we call them explicitly).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm deployment to production'
        required: true

jobs:
  migrate-prod-db:
    name: Apply pending DB migrations (prod)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'promote'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Dry-run (audit pending migrations)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: bash scripts/ops/migrate-prod.sh --dry
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: bash scripts/ops/migrate-prod.sh

  promote:
    name: Promote main → production
    runs-on: ubuntu-latest
    needs: migrate-prod-db
    if: github.event.inputs.confirm == 'promote'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward production to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout production
          git merge --ff-only origin/main
          git push origin production
          echo "### Promoted main → production" >> $GITHUB_STEP_SUMMARY
          echo "Commit: $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY

  release-daemon:
    name: Release Daemon (production)
    needs: promote
    uses: ./.github/workflows/release-daemon.yml
    with:
      ref: production
    secrets: inherit

  deploy-worker:
    name: Deploy Worker (production)
    needs: promote
    uses: ./.github/workflows/deploy-worker.yml
    with:
      ref: production
    secrets: inherit

  deploy-broker:
    name: Deploy Broker (production)
    needs: promote
    uses: ./.github/workflows/deploy-broker.yml
    with:
      ref: production
    secrets: inherit
