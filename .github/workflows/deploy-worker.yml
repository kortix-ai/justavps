name: Deploy Worker

# Deploys the Cloudflare Worker proxy whenever workers/proxy/ code changes.
# main -> dev worker (*.kortix-dev.cloud)
# production -> prod worker (*.kortix.cloud)

on:
  push:
    branches: [main, production]
    paths:
      - 'workers/proxy/**'
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

concurrency:
  group: deploy-worker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install dependencies
        working-directory: workers/proxy
        run: npm ci

      - name: Type check
        working-directory: workers/proxy
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: workers/proxy
        run: npx vitest run

  deploy:
    name: Deploy to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    env:
      WORKER_CONFIG: ${{ (inputs.ref || github.ref_name) == 'production' && 'wrangler.toml' || 'wrangler.dev.toml' }}
      WORKER_NAME: ${{ (inputs.ref || github.ref_name) == 'production' && 'kortix-cloud-proxy' || 'kortix-cloud-proxy-dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install dependencies
        working-directory: workers/proxy
        run: npm ci

      - name: Deploy Worker
        working-directory: workers/proxy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: npx wrangler deploy -c $WORKER_CONFIG

      - name: Verify deployment
        working-directory: workers/proxy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          VERSION=$(npx wrangler deployments list --name "$WORKER_NAME" 2>&1 | head -10)
          echo "$VERSION"
          echo "### Worker Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Config: $WORKER_CONFIG" >> $GITHUB_STEP_SUMMARY
          echo "Worker: $WORKER_NAME" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$VERSION" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
