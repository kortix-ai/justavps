name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run

  sdk-check:
    name: SDK Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Regenerate TS SDK from the committed openapi.json (not from production)
      - run: npx @hey-api/openapi-ts

      - name: Fail if SDK is stale
        run: |
          if [ -n "$(git diff --name-only src/sdk/generated/)" ]; then
            echo "::error::SDK generated code is out of date. Run 'pnpm sdk:generate:ts' and commit."
            git diff --stat src/sdk/generated/
            exit 1
          fi
