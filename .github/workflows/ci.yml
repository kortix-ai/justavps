name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      DB_SSL: 'false'
      # These need to be set independently — not as AUTH_SECRET fallbacks —
      # so tests that override AUTH_SECRET='' still see the others configured.
      # Keeps config-audit error counts predictable across environments.
      AUTH_SECRET: ci-dummy-not-sensitive
      PROXY_AUTH_SECRET: ci-dummy-proxy-not-sensitive
      DATA_ENCRYPTION_KEY: ci-dummy-data-encryption-key-not-sensitive
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply schema to CI postgres
        run: pnpm drizzle-kit push --url="$DATABASE_URL" --dialect=postgresql --schema=./src/server/db/schema.ts
      - run: pnpm vitest run

  sdk-check:
    name: SDK Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Regenerate TS SDK from the committed openapi.json (not from production)
      - run: npx @hey-api/openapi-ts

      - name: Fail if SDK is stale
        run: |
          if [ -n "$(git diff --name-only src/sdk/generated/)" ]; then
            echo "::error::SDK generated code is out of date. Run 'pnpm sdk:generate:ts' and commit."
            git diff --stat src/sdk/generated/
            exit 1
          fi
