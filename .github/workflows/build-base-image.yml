name: Build Base Image

# Fully automated base image pipeline:
#   1. Build a fresh 40 GB snapshot on Hetzner (cx23, hel1)
#   2. Update HETZNER_BASE_SNAPSHOT_ID in Vercel (all environments) via API
#   3. Trigger a production redeploy so the new snapshot is live
#   4. Seed the DB image record with the new snapshot ID

on:
  # Manual trigger — run anytime from the Actions tab
  workflow_dispatch:
    inputs:
      location:
        description: 'Hetzner datacenter (hel1, fsn1, nbg1)'
        required: false
        default: 'hel1'
      server_type:
        description: 'Build machine type (cx23 = 2v/4GB/40GB)'
        required: false
        default: 'cx23'
      daemon_channel:
        description: 'Daemon release channel (latest or dev)'
        required: false
        default: 'latest'

  # Automatic trigger — rebuild base image after every production daemon release
  # so the new daemon version is baked in and machines provision faster.
  workflow_run:
    workflows: ["Release Daemon"]
    branches: [production]
    types: [completed]

env:
  VERCEL_ORG_ID: team_6wPTUrLXccl65xQAtgxIFIt6
  VERCEL_PROJECT_ID: prj_Ky8G1r3uj0nlr5SrmDhrPauaVuLw

jobs:
  build:
    name: Build snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # When triggered by workflow_run, only proceed if the daemon release succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      snapshot_id: ${{ steps.build.outputs.snapshot_id }}
      disk_gb: ${{ steps.build.outputs.disk_gb }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build snapshot
        id: build
        env:
          HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
          BUILD_LOCATION: ${{ inputs.location || 'hel1' }}
          BUILD_SERVER_TYPE: ${{ inputs.server_type || 'cx23' }}
          DAEMON_CHANNEL: ${{ inputs.daemon_channel || 'latest' }}
        run: |
          npx tsx scripts/build-base-image.ts 2>&1 | tee /tmp/build-output.txt
          SNAP_ID=$(grep -oP 'Snapshot ID:\s+\K\d+' /tmp/build-output.txt)
          DISK_GB=$(grep -oP 'Disk size:\s+\K\d+' /tmp/build-output.txt)
          echo "snapshot_id=$SNAP_ID" >> "$GITHUB_OUTPUT"
          echo "disk_gb=$DISK_GB" >> "$GITHUB_OUTPUT"
          echo "Snapshot $SNAP_ID (${DISK_GB}GB) built"

  update-vercel:
    name: Update Vercel env
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update HETZNER_BASE_SNAPSHOT_ID in all Vercel environments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: python3 scripts/vercel-update-env.py ${{ needs.build.outputs.snapshot_id }}

  redeploy:
    name: Redeploy production
    needs: update-vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Vercel production redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: python3 scripts/vercel-redeploy.py

  seed-db:
    name: Seed DB
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Seed DB with new snapshot ID
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DB_SSL: 'true'
          HETZNER_BASE_SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
        run: npx tsx scripts/seed-base-image.ts

  summary:
    name: Summary
    needs: [build, update-vercel, redeploy, seed-db]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        run: |
          SNAP="${{ needs.build.outputs.snapshot_id }}"
          DISK="${{ needs.build.outputs.disk_gb }}"
          BUILD="${{ needs.build.result }}"
          ENV="${{ needs.update-vercel.result }}"
          DEPLOY="${{ needs.redeploy.result }}"
          SEED="${{ needs.seed-db.result }}"
          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          echo "### Base Image Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build snapshot | $(icon $BUILD) $BUILD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Update Vercel env | $(icon $ENV) $ENV |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Redeploy production | $(icon $DEPLOY) $DEPLOY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Seed DB | $(icon $SEED) $SEED |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snapshot ID | \`$SNAP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Disk | ${DISK} GB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Location | ${{ inputs.location }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Server type | ${{ inputs.server_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Daemon | ${{ inputs.daemon_channel }} |" >> "$GITHUB_STEP_SUMMARY"
