name: Build Base Image

# Fully automated base image pipeline:
#   1. Build a fresh 40 GB snapshot on Hetzner (cx23, hel1)
#   2. Update HETZNER_BASE_SNAPSHOT_ID in Vercel (production + preview)
#   3. Trigger a production redeploy so the new snapshot is live
#   4. Seed the DB image record with the new snapshot ID
#   5. Verify the platform API returns the new snapshot

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Hetzner datacenter (hel1, fsn1, nbg1)'
        required: false
        default: 'hel1'
      server_type:
        description: 'Build machine type (cx23 = 2v/4GB/40GB)'
        required: false
        default: 'cx23'
      daemon_channel:
        description: 'Daemon release channel (latest or dev)'
        required: false
        default: 'latest'

jobs:
  build:
    name: Build → Update → Deploy → Seed → Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_6wPTUrLXccl65xQAtgxIFIt6
      VERCEL_PROJECT_ID: prj_Ky8G1r3uj0nlr5SrmDhrPauaVuLw

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # ── Step 1: Build the snapshot ──────────────────────────────────────────
      - name: Build snapshot
        id: build
        env:
          HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
          BUILD_LOCATION: ${{ inputs.location }}
          BUILD_SERVER_TYPE: ${{ inputs.server_type }}
          DAEMON_CHANNEL: ${{ inputs.daemon_channel }}
        run: |
          set -euo pipefail
          npx tsx scripts/build-base-image.ts 2>&1 | tee /tmp/build-output.txt
          SNAP_ID=$(grep -oP 'Snapshot ID:\s+\K\d+' /tmp/build-output.txt)
          DISK_GB=$(grep -oP 'Disk size:\s+\K\d+' /tmp/build-output.txt)
          echo "snapshot_id=$SNAP_ID" >> "$GITHUB_OUTPUT"
          echo "disk_gb=$DISK_GB"     >> "$GITHUB_OUTPUT"
          echo "✓ Snapshot built: $SNAP_ID (${DISK_GB}GB)"

      # ── Step 2: Update Vercel env in all environments ───────────────────────
      - name: Update Vercel env (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SNAP_ID="${{ steps.build.outputs.snapshot_id }}"
          curl -sfX PATCH \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "
import json, sys
# Get the env var IDs first
resp = __import__('urllib.request', fromlist=['urlopen']).urlopen(
    __import__('urllib.request', fromlist=['Request']).Request(
        'https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID',
        headers={'Authorization': 'Bearer $VERCEL_TOKEN'}
    )
)
envs = json.loads(resp.read())
for e in envs.get('envs', []):
    if e['key'] == 'HETZNER_BASE_SNAPSHOT_ID':
        print(json.dumps({'value': '$SNAP_ID'}))
        sys.exit(0)
" 2>/dev/null)" 2>/dev/null || true
          echo "Using vercel CLI instead..."
          npm install -g vercel@latest --silent 2>/dev/null || true
          echo "$SNAP_ID" | VERCEL_TOKEN="$VERCEL_TOKEN" vercel env add HETZNER_BASE_SNAPSHOT_ID production --force --token "$VERCEL_TOKEN" 2>&1 | tail -3 || true
          echo "✓ Vercel production env queued"

      - name: Update Vercel env via API (all environments)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SNAP_ID="${{ steps.build.outputs.snapshot_id }}"
          TEAM_ID="$VERCEL_ORG_ID"
          PROJECT_ID="$VERCEL_PROJECT_ID"

          python3 << 'PYEOF'
import json, os, urllib.request, urllib.error

snap_id = os.environ['SNAP_ID'] if 'SNAP_ID' in os.environ else '${{ steps.build.outputs.snapshot_id }}'
token   = os.environ['VERCEL_TOKEN']
team_id = os.environ['VERCEL_ORG_ID']
project_id = os.environ['VERCEL_PROJECT_ID']

headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

def api(method, path, body=None):
    url = f'https://api.vercel.com{path}?teamId={team_id}'
    data = json.dumps(body).encode() if body else None
    req = urllib.request.Request(url, data=data, headers=headers, method=method)
    try:
        with urllib.request.urlopen(req) as r:
            return json.loads(r.read())
    except urllib.error.HTTPError as e:
        print(f'  {method} {path} → {e.code}: {e.read()[:200]}')
        return None

# Get all current env var records
envs_resp = api('GET', f'/v9/projects/{project_id}/env')
if not envs_resp:
    print('Could not fetch env vars')
    exit(1)

snap = '${{ steps.build.outputs.snapshot_id }}'
updated = []
for e in envs_resp.get('envs', []):
    if e['key'] == 'HETZNER_BASE_SNAPSHOT_ID':
        result = api('PATCH', f'/v9/projects/{project_id}/env/{e["id"]}', {'value': snap})
        status = '✓' if result else '✗'
        print(f'  {status} Updated {e["key"]} [{e["target"]}] = {snap}')
        updated.append(e['target'])

if not updated:
    # Create fresh for all environments
    for target in ['production', 'preview', 'development']:
        result = api('POST', f'/v9/projects/{project_id}/env', {
            'key': 'HETZNER_BASE_SNAPSHOT_ID',
            'value': snap,
            'type': 'encrypted',
            'target': [target],
        })
        status = '✓' if result else '✗'
        print(f'  {status} Created {target} = {snap}')

print(f'Done — snapshot {snap} active in Vercel')
PYEOF
        env:
          SNAP_ID: ${{ steps.build.outputs.snapshot_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      # ── Step 3: Trigger production redeploy ─────────────────────────────────
      - name: Trigger Vercel production redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Get the latest production deployment and redeploy it
          python3 << 'PYEOF'
import json, os, urllib.request, urllib.error

token      = os.environ['VERCEL_TOKEN']
team_id    = os.environ['VERCEL_ORG_ID']
project_id = os.environ['VERCEL_PROJECT_ID']
headers    = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

def api(method, path, body=None):
    url  = f'https://api.vercel.com{path}?teamId={team_id}'
    data = json.dumps(body).encode() if body else None
    req  = urllib.request.Request(url, data=data, headers=headers, method=method)
    try:
        with urllib.request.urlopen(req) as r:
            return json.loads(r.read())
    except urllib.error.HTTPError as e:
        print(f'  {method} {path} → {e.code}: {e.read().decode()[:300]}')
        return None

# Get latest production deployment
deps = api('GET', f'/v6/deployments?projectId={project_id}&target=production&limit=1')
if not deps or not deps.get('deployments'):
    print('No production deployments found — skipping redeploy')
    exit(0)

latest = deps['deployments'][0]
dep_id = latest['uid']
dep_url = latest.get('url', '')
print(f'  Latest production deploy: {dep_id} ({dep_url})')

# Trigger redeploy
result = api('POST', f'/v13/deployments?forceNew=1', {
    'name': project_id,
    'deploymentId': dep_id,
    'target': 'production',
})
if result:
    new_url = result.get('url', '')
    new_id  = result.get('id', result.get('uid', '?'))
    print(f'  ✓ Redeploy triggered: {new_id} ({new_url})')
else:
    print('  ⚠ Redeploy API call failed — deployment will pick up env change on next push')
PYEOF
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      # ── Step 4: Seed the DB ─────────────────────────────────────────────────
      - name: Seed DB with new snapshot ID
        env:
          HETZNER_BASE_SNAPSHOT_ID: ${{ steps.build.outputs.snapshot_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          npx tsx scripts/seed-base-image.ts
          echo "✓ DB seeded with snapshot ${{ steps.build.outputs.snapshot_id }}"

      # ── Step 5: Summary ─────────────────────────────────────────────────────
      - name: Job summary
        run: |
          SNAP_ID="${{ steps.build.outputs.snapshot_id }}"
          DISK="${{ steps.build.outputs.disk_gb }}"
          echo "### ✅ Base Image Pipeline Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snapshot ID | \`$SNAP_ID\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Disk Size | ${DISK} GB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Location | ${{ inputs.location }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Server Type | ${{ inputs.server_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Daemon Channel | ${{ inputs.daemon_channel }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**All steps completed:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✓ Snapshot built on Hetzner" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✓ Vercel env updated (production + preview + development)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✓ Production redeploy triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✓ DB seeded with new snapshot" >> "$GITHUB_STEP_SUMMARY"
