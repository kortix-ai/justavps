name: Publish SDKs

# Trigger: push to master that touches SDK source or API routes/schemas
on:
  push:
    branches: [master, main]
    paths:
      - "src/sdk/**"
      - "src/server/routes/**"
      - "src/server/app.ts"
      - "src/server/lib/openapi-enrichment.ts"
      - "src/lib/schemas.ts"

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing + npm provenance

jobs:
  publish:
    name: Publish SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - run: pip install build

      # ── Version: CalVer YYYY.M.patch ─────────────────────────────────────
      - name: Calculate version
        id: version
        run: |
          PREFIX="$(date +%Y).$(date +%-m)"
          LATEST=$(git tag -l "sdk-v${PREFIX}.*" --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then PATCH=0; else PATCH=$(( $(echo "$LATEST" | grep -oP '\d+$') + 1 )); fi
          echo "version=${PREFIX}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "📦 SDK version: ${PREFIX}.${PATCH}"

      # ── TypeScript SDK → npm ─────────────────────────────────────────────
      - name: Build & publish TS SDK
        working-directory: src/sdk/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Set version
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='${{ steps.version.outputs.version }}'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          # Build
          npm install --no-save tsup typescript
          npx tsup
          # Publish
          npm publish --provenance --access public

      # ── Python SDK → PyPI ────────────────────────────────────────────────
      - name: Build & publish Python SDK
        working-directory: src/sdk/python
        run: |
          # Set version
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          # Build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/sdk/python/dist/

      # ── Tag ──────────────────────────────────────────────────────────────
      - name: Tag release
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "sdk-v${V}" -m "SDK v${V}"
          git push origin "sdk-v${V}"

      - name: Summary
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "### 📦 SDK v${V}" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Install |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| [\`@justavps/sdk\`](https://www.npmjs.com/package/@justavps/sdk) | \`npm i @justavps/sdk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| [\`justavps\`](https://pypi.org/project/justavps/) | \`pip install justavps\` |" >> $GITHUB_STEP_SUMMARY
