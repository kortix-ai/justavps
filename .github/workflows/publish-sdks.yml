name: Publish SDKs

# ─── Auto-publish on ANY change to SDK source, API routes, or schemas ────────
# Versioning: CalVer YYYY.M.PATCH (auto-increments patch per month)
# Example: 2026.3.0, 2026.3.1, 2026.3.2, then 2026.4.0 next month
on:
  push:
    branches: [master, main]
    paths:
      - "src/sdk/**"
      - "src/server/routes/**"
      - "src/server/app.ts"
      - "src/server/lib/openapi-enrichment.ts"
      - "src/lib/schemas.ts"
      - ".github/workflows/publish-sdks.yml"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish SDKs
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - run: pip install build

      # ── Calculate next version ─────────────────────────────────────────
      - name: Calculate version
        id: version
        run: |
          PREFIX="$(date +%Y).$(date +%-m)"
          LATEST=$(git tag -l "sdk-v${PREFIX}.*" --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            PATCH=0
          else
            PATCH=$(( $(echo "$LATEST" | grep -oP '\d+$') + 1 ))
          fi
          VERSION="${PREFIX}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 SDK version: ${VERSION}"

      # ── Check if already published (skip if so) ────────────────────────
      - name: Check npm
        id: check_npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@kortix/justavps@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ npm @kortix/justavps@${VERSION} already exists"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PyPI
        id: check_pypi
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if pip index versions kortix-justavps 2>/dev/null | grep -q "${VERSION}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ PyPI kortix-justavps@${VERSION} already exists"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── TypeScript SDK → npm ───────────────────────────────────────────
      - name: Build & publish TS SDK
        if: steps.check_npm.outputs.skip != 'true'
        working-directory: src/sdk/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          rm -rf node_modules package-lock.json
          npm install tsup typescript --save-dev
          npx tsup
          npm publish --access public

      # ── Python SDK → PyPI ──────────────────────────────────────────────
      - name: Build Python SDK
        if: steps.check_pypi.outputs.skip != 'true'
        working-directory: src/sdk/python
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          python -m build

      - name: Publish to PyPI
        if: steps.check_pypi.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/sdk/python/dist/

      # ── Tag release ────────────────────────────────────────────────────
      - name: Tag release
        if: steps.check_npm.outputs.skip != 'true' || steps.check_pypi.outputs.skip != 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "sdk-v${V}" -m "SDK v${V}"
          git push origin "sdk-v${V}"

      # ── Summary ────────────────────────────────────────────────────────
      - name: Summary
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "### 📦 SDK v${V}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_npm.outputs.skip }}" = "true" ]; then
            echo "| \`@kortix/justavps\` | ${V} | ⏭️ Skipped (exists) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| [\`@kortix/justavps\`](https://www.npmjs.com/package/@kortix/justavps) | ${V} | ✅ Published |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.check_pypi.outputs.skip }}" = "true" ]; then
            echo "| \`kortix-justavps\` | ${V} | ⏭️ Skipped (exists) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| [\`kortix-justavps\`](https://pypi.org/project/kortix-justavps/) | ${V} | ✅ Published |" >> $GITHUB_STEP_SUMMARY
          fi
