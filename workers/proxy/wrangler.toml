name = "kortix-cloud-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-18"

# Route: all traffic to *.kortix.cloud goes through this Worker
# Set via Cloudflare dashboard: Workers Routes → *.kortix.cloud/*

[env.production]
name = "kortix-cloud-proxy"

[env.staging]
name = "kortix-cloud-proxy-staging"

[[kv_namespaces]]
binding = "KV"
preview_id = "b6332b3e89104ea89321ec2ca20382ad"
id = "250d587f8010426a8259d1fab5b2abe4"

[vars]
ENVIRONMENT = "production"
PLATFORM_URL = "https://justavps.com"

# Secrets (set via `wrangler secret put`):
#   PROXY_AUTH_SECRET — MUST match across ALL platform environments (dev + prod).
#   This single Worker verifies JWT tokens from both dev.justavps.com and justavps.com.
#   If they differ, proxy auth will fail for one environment.

[placement]
mode = "smart"
